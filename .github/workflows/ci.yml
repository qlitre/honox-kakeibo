name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      # Workers ランタイム（workerd）+ ローカルD1。秘匿値は不要（wrangler.test.jsonc のダミー値のみ）
      - name: Integration tests
        run: yarn test:int

      - name: Build
        run: yarn build
